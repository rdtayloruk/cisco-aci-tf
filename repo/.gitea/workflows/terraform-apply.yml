name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'scopes/**'

jobs:
  apply:
    name: Apply (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - scope: scopes/tenants/OSS
            state_name: tenant-oss
          - scope: scopes/tenants/OSS-DMZ
            state_name: tenant-oss-dmz
          - scope: scopes/access-policies/shared
            state_name: access-shared
          - scope: scopes/access-policies/services
            state_name: access-services
          - scope: scopes/fabric-policies/local-fabric
            state_name: fabric-local
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ${{ matrix.scope }}
        run: |
          terraform init \
            -backend-config="address=${{ gitea.server_url }}/api/packages/${{ gitea.repository_owner }}/terraform/state/${{ matrix.state_name }}" \
            -backend-config="lock_address=${{ gitea.server_url }}/api/packages/${{ gitea.repository_owner }}/terraform/state/${{ matrix.state_name }}/lock" \
            -backend-config="unlock_address=${{ gitea.server_url }}/api/packages/${{ gitea.repository_owner }}/terraform/state/${{ matrix.state_name }}/lock" \
            -backend-config="lock_method=POST" \
            -backend-config="unlock_method=DELETE" \
            -backend-config="retry_wait_min=5"
        env:
          TF_HTTP_USERNAME: ${{ secrets.TF_HTTP_USERNAME }}
          TF_HTTP_PASSWORD: ${{ secrets.TF_HTTP_PASSWORD }}

      - name: Terraform Apply
        working-directory: ${{ matrix.scope }}
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_aci_username: ${{ secrets.ACI_USERNAME }}
          TF_VAR_aci_password: ${{ secrets.ACI_PASSWORD }}
          TF_VAR_aci_url: ${{ secrets.ACI_URL }}
          TF_HTTP_USERNAME: ${{ secrets.TF_HTTP_USERNAME }}
          TF_HTTP_PASSWORD: ${{ secrets.TF_HTTP_PASSWORD }}
